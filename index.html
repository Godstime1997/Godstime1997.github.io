<script>
// === EMAILJS CONFIG - FINAL FIXED ===
const EMAILJS_PUBLIC_KEY = "AY9jEifwIPRBqpPjZ";
const EMAILJS_TEMPLATE_ID = "template_qcs3aef"; 
const EMAILJS_SERVICE_ID = "service_hzprlr6";

emailjs.init(EMAILJS_PUBLIC_KEY);

const PAYSTACK_KEY = "pk_live_522e90bc4d7ec45abe67ed9b807d7512a0d8ce5b";
const MASTER_CODE = "NDU-GODSTIME-ADMIN-99";

function checkCode(){
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  const msg = document.getElementById("msg");
  if(code === MASTER_CODE || code.startsWith("NDU-")){
    localStorage.setItem("ndu_paid","yes");
    localStorage.setItem("ndu_code", code);
    document.getElementById("paywall").style.display="none";
    document.getElementById("calculatorContent").style.display="block";
  } else {
    msg.innerText="Invalid Code! Pay ₦1,000 to get code";
  }
}
function copyInputCode(){
  let v = document.getElementById("codeInput").value.trim();
  if(!v){ alert("No code yet, pay first"); return; }
  navigator.clipboard.writeText(v);
  alert("Copied: "+v);
}

function payWithPaystack(){
  const buyerEmail = document.getElementById("buyerEmail").value.trim();
  if(!buyerEmail || !buyerEmail.includes("@")){
    alert("Please enter your Gmail first to receive code");
    return;
  }
  var handler = PaystackPop.setup({
    key: PAYSTACK_KEY,
    email: buyerEmail,
    amount: 100000,
    currency: "NGN",
    ref: "NDU-"+Math.floor(Math.random()*1000000000),
    callback: function(response){
      let code = "NDU-" + response.reference.slice(-8).toUpperCase();
      document.getElementById("codeInput").value = code;
      document.getElementById("msg").innerHTML = '<div style="background:#0f172a;padding:12px;border-radius:10px;border:2px solid #38bdf8;"><p style="color:#22c55e;font-weight:bold;margin:0;">✅ Payment Successful! Sending to '+buyerEmail+'</p><p style="color:white;font-size:18px;font-weight:bold;margin:8px 0;word-break:break-all;">'+code+'</p></div>';

      // SEND EMAIL AUTOMATICALLY - FIXED
      emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        to_email: buyerEmail,
        user_email: buyerEmail,
        access_code: code,
        ref: response.reference
      }).then(function(){
        document.getElementById("msg").innerHTML += '<p style="color:#22c55e;margin-top:10px;">📧 Code sent to '+buyerEmail+' - Check inbox/spam</p><button onclick="checkCode()" type="button" style="background:white;color:black;padding:10px 20px;border:none;border-radius:6px;width:auto;font-weight:bold;margin-top:10px;cursor:pointer;">Unlock Now →</button>';
      }, function(err){
        console.log(err);
        document.getElementById("msg").innerHTML += '<p style="color:#f87171;">Email failed but your code is: '+code+' - Screenshot it!</p><button onclick="checkCode()" type="button" style="background:white;color:black;padding:10px 20px;border:none;border-radius:6px;width:auto;font-weight:bold;margin-top:10px;cursor:pointer;">Unlock Now →</button>';
      });
    },
    onClose: function(){ alert("Payment window closed"); }
  });
  handler.openIframe();
}
window.onload = function(){
  if(localStorage.getItem("ndu_paid")==="yes"){
    document.getElementById("paywall").style.display="none";
    document.getElementById("calculatorContent").style.display="block";
  }
}
        </script>
