<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Godstime WSC + Petroleum Toolkit</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f8f9fa;}
.top{position:sticky;top:0;z-index:100;background:#0f172a;padding:12px;text-align:center;display:flex;justify-content:center;gap:10px;}
.top a{color:white;text-decoration:none;background:#1e293b;padding:8px 14px;border-radius:20px;font-size:14px;}
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0f172a,#001a12);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;}
.lockBox{background:white;padding:25px;border-radius:16px;max-width:360px;width:100%;text-align:center;}
.codeDisplay{background:#f0fdf4;border:2px dashed #16a34a;padding:15px;font-size:22px;font-weight:bold;letter-spacing:2px;margin:15px 0;border-radius:10px;color:#0f172a;}
.nysc-card{display:block;background:white;margin:10px;padding:15px;border-radius:10px;text-decoration:none;color:#0a3d2e;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
</style>
</head>
<body>

<!-- LOCK - Covers everything until payment -->
<div id="lockScreen">
  <div class="lockBox" id="lockInner">
    <h2 style="margin:0;color:#0f172a;">🔒 Content Locked</h2>
    <p style="color:#666;font-size:14px;">Pay first to get your personal access code.<br>Developer Master: GODSTIME-MASTER-2026</p>
    <input id="codeInput" placeholder="Enter code e.g NDU-XXXX" style="padding:12px;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;margin:10px 0;">
    <button onclick="unlockNow()" style="padding:12px;width:100%;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">Unlock Content</button>
    <div style="margin:15px 0;border-top:1px solid #eee;padding-top:15px;">
      <button onclick="payNow(70000,'NYSC')" style="padding:12px;width:100%;background:#0f172a;color:white;border:none;border-radius:8px;margin:5px 0;">Pay ₦700 for NYSC Code</button>
      <button onclick="payNow(100000,'TOOLKIT')" style="padding:12px;width:100%;background:#eab308;color:#000;border:none;border-radius:8px;margin:5px 0;font-weight:bold;">Pay ₦1,000 for Toolkit Code</button>
    </div>
    <p id="msg" style="color:red;font-size:13px;"></p>
  </div>
</div>

<div class="top">
  <a href="#" onclick="showSection('nysc')">NYSC Guide</a>
  <a href="#" onclick="showSection('petSec')">Petroleum Toolkit Pro</a>
</div>

<div id="nysc" style="display:block;padding:25px;text-align:center;">
  <h2>NYSC Guide 2026</h2>
  <a class="nysc-card" href="nysc-history-of-nysc-in-nigeria.html">📘 History of NYSC</a>
  <a class="nysc-card" href="nysc-senate-list-2026.html">📋 Senate List 2026</a>
  <a class="nysc-card" href="nysc-registration-guide-2026.html">📝 Registration Guide</a>
  <a class="nysc-card" href="nysc-camp-requirements-what-to-take-2026.html">🎒 Camp Requirements</a>
</div>

<div id="petSec" style="display:none;background:#01172a;min-height:100vh;padding:20px;color:white;text-align:center;">
  <h2 style="color:#3bd8ff;">NDU Petroleum Toolkit Pro</h2>
  <p style="color:#94a3b8;">Porosity Calculator Inside</p>
  <div id="calc" style="display:block;text-align:left;max-width:400px;margin:20px auto;background:#0a2a4a;padding:20px;border-radius:12px;">
    <input id="pv" type="number" placeholder="Pore Volume" style="width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none;">
    <input id="bv" type="number" placeholder="Bulk Volume" style="width:100%;padding:10px;margin:5px 0;border-radius:5px;border:none;">
    <button onclick="calcPor()" style="padding:10px 20px;width:100%;background:#3bd8ff;border:none;border-radius:5px;">Calculate Porosity</button>
    <p id="porRes" style="font-weight:bold;"></p>
  </div>
</div>

<script>
const PAYSTACK_KEY="pk_live_522e60bcd74c45e2be7a60b7512a60b5c3e5b";
const MASTER_CODE="GODSTIME-MASTER-2026";
const MASTER_CODE2="GODSTIME1997";

function generateCode(type){
  const r1=Math.random().toString(36).substring(2,6).toUpperCase();
  const r2=Math.random().toString(36).substring(2,6).toUpperCase();
  return `NDU-${type}-${r1}${r2}`;
}
function showSection(id){
  if(localStorage.getItem('ndu_unlocked')!=='yes'){ document.getElementById('lockScreen').style.display='flex'; return; }
  document.getElementById('nysc').style.display = id==='nysc' ? 'block':'none';
  document.getElementById('petSec').style.display = id==='petSec' ? 'block':'none';
}
function unlockNow(){
  let c=document.getElementById('codeInput').value.trim().toUpperCase();
  const saved=JSON.parse(localStorage.getItem('validNDUCodes')||'[]');
  if(c===MASTER_CODE || c===MASTER_CODE2 || saved.includes(c)){
    localStorage.setItem('ndu_unlocked','yes');
    document.getElementById('lockScreen').style.display='none';
  }else{
    document.getElementById('msg').innerText="❌ Invalid code. Pay to get code.";
  }
}
function payNow(amount,type){
  var handler=PaystackPop.setup({
    key:PAYSTACK_KEY, email:"customer@ndu.edu.ng", amount:amount, currency:"NGN",
    callback:function(response){
      const newCode=generateCode(type);
      const saved=JSON.parse(localStorage.getItem('validNDUCodes')||'[]');
      saved.push(newCode);
      localStorage.setItem('validNDUCodes',JSON.stringify(saved));
      localStorage.setItem('ndu_unlocked','yes');
      document.getElementById('lockInner').innerHTML=`
        <h2 style="color:green;">✅ Payment Successful!</h2>
        <p>Your Personal Code for ${type}:</p>
        <div class="codeDisplay">${newCode}</div>
        <button onclick="navigator.clipboard.writeText('${newCode}')" style="padding:10px 20px;background:#eee;border:1px solid #ccc;border-radius:5px;">📋 Copy Code</button>
        <br><br>
        <button onclick="location.reload()" style="padding:12px 25px;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:bold;width:100%;">Unlock Now →</button>
        <p style="font-size:11px;color:red;margin-top:10px;">⚠️ COPY AM! You need this code next time.</p>
      `;
    },
    onClose:function(){ document.getElementById('msg').innerText="Payment cancelled"; }
  });
  handler.openIframe();
}
window.onload=function(){
  if(localStorage.getItem('ndu_unlocked')==='yes'){
    document.getElementById('lockScreen').style.display='none';
  }
};
function calcPor(){
  let pv=parseFloat(document.getElementById('pv').value);
  let bv=parseFloat(document.getElementById('bv').value);
  if(!pv||!bv){document.getElementById('porRes').innerText="Enter both values";return;}
  let res=(pv/bv)*100;
  document.getElementById('porRes').innerText="Porosity = "+res.toFixed(2)+" %";
}
</script>
</body>
  </html>
