<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12 Topics Math - NDU</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Arial;background:#f8fafc;margin:0}header{background:#0f172a;color:#fff;text-align:center;padding:20px}h1{color:#38bdf8;font-size:18px}.wrap{max-width:900px;margin:auto;padding:10px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px}.input{width:100%;padding:10px;border:2px solid #0ea5e9;border-radius:8px;background:#f0f9ff;font-weight:700;margin:4px 0}.btn{width:100%;padding:12px;background:#0ea5e9;color:#fff;border:0;border-radius:8px;font-weight:800;cursor:pointer}.box{background:#f1f5f9;padding:8px;border-left:4px solid #0ea5e9;margin-top:6px;font-size:12px;white-space:pre-wrap}.ans{background:#0f172a;color:#22c55e;padding:8px;border-radius:6px;margin-top:6px;font-weight:700;white-space:pre-wrap}canvas{border:1px solid #ddd;border-radius:8px;margin-top:6px}</style></head><body><header><h1>12 Topics - Question Steps Graph Answer</h1></header><div class="wrap">

<div class="card"><h3>1 ODE f=x+y</h3><input id="a1" class="input" value="x + y"><input id="a2" class="input" type="number" value="0"><input id="a3" class="input" type="number" value="1"><input id="a4" class="input" type="number" value="0.1"><input id="a5" class="input" type="number" value="10"><button class="btn" onclick="f1()">SOLVE ODE</button><div id="b1" class="box"></div><div id="c1" class="ans"></div><canvas id="d1" height="120"></canvas></div>

<div class="card"><h3>2 Laplace t^2</h3><input id="a6" class="input" value="t^2"><button class="btn" onclick="f2()">LAPLACE</button><div id="b2" class="box"></div><div id="c2" class="ans"></div><canvas id="d2" height="120"></canvas></div>

<div class="card"><h3>3 Matrix 2,1;1,2</h3><input id="a7" class="input" value="2,1;1,2"><button class="btn" onclick="f3()">MATRIX</button><div id="b3" class="box"></div><div id="c3" class="ans"></div></div>

<div class="card"><h3>4 Newton x^3-x-2</h3><input id="a8" class="input" value="x^3 - x - 2"><input id="a9" class="input" value="3*x^2 - 1"><input id="a10" class="input" type="number" value="1.5"><button class="btn" onclick="f4()">ROOT</button><div id="b4" class="box"></div><div id="c4" class="ans"></div><canvas id="d4" height="120"></canvas></div>

<div class="card"><h3>5 Simpson x^2 0-2</h3><input id="a11" class="input" value="x^2"><input id="a12" class="input" type="number" value="0"><input id="a13" class="input" type="number" value="2"><input id="a14" class="input" type="number" value="10"><button class="btn" onclick="f5()">INTEGRATE</button><div id="b5" class="box"></div><div id="c5" class="ans"></div><canvas id="d5" height="120"></canvas></div>

<div class="card"><h3>6 Fourier L=2 N=5</h3><button class="btn" onclick="f6()">FOURIER</button><div id="b6" class="box"></div><div id="c6" class="ans"></div><canvas id="d6" height="120"></canvas></div>

<div class="card"><h3>7 Taylor exp(x)</h3><input id="a15" class="input" value="exp(x)"><button class="btn" onclick="f7()">TAYLOR</button><div id="b7" class="box"></div><div id="c7" class="ans"></div><canvas id="d7" height="120"></canvas></div>

<div class="card"><h3>8 PDE A=1 B=0 C=-1</h3><button class="btn" onclick="f8()">PDE TYPE</button><div id="b8" class="box"></div><div id="c8" class="ans"></div></div>

<div class="card"><h3>9 Complex 3+4i</h3><button class="btn" onclick="f9()">COMPLEX</button><div id="b9" class="box"></div><div id="c9" class="ans"></div></div>

<div class="card"><h3>10 Vector x^2*y</h3><input id="a16" class="input" value="x^2*y"><button class="btn" onclick="f10()">GRADIENT</button><div id="b10" class="box"></div><div id="c10" class="ans"></div></div>

<div class="card"><h3>11 Beta Gamma 5</h3><button class="btn" onclick="f11()">BETA GAMMA</button><div id="b11" class="box"></div><div id="c11" class="ans"></div></div>

<div class="card"><h3>12 Z-Transform a^n 0.5</h3><button class="btn" onclick="f12()">Z-TRANS</button><div id="b12" class="box"></div><div id="c12" class="ans"></div></div>

</div><script>let C={};function E(e,x,y=0){try{return Function('x','y','with(Math){return '+e.replace(/\^/g,'**')+'}')(x,y);}catch{return NaN;}}
function f1(){let f=a1.value,x0=+a2.value,y0=+a3.value,h=+a4.value,n=+a5.value,x=x0,y=y0,s='Q: dy/dx='+f+'\nFormula y_{n+1}=y_n+h*f\nSteps:\n',xs=[x0],ys=[y0];for(let i=0;i<n;i++){let k=E(f,x,y),y1=y+h*k;s+='Step '+(i+1)+': x='+x.toFixed(2)+' y='+y.toFixed(4)+' => '+y1.toFixed(4)+'\n';y=y1;x+=h;xs.push(x);ys.push(y);}b1.innerText=s;c1.innerText='FINAL: y('+x.toFixed(2)+')='+y.toFixed(6);let e=d1;if(C.a)C.a.destroy();C.a=new Chart(e,{type:'line',data:{labels:xs.map(v=>v.toFixed(2)),datasets:[{label:'y vs x',data:ys,borderColor:'#0ea5e9'}]}});}
function f2(){let f=a6.value,m={'t^2':'2/s^3','t':'1/s^2','sin(t)':'1/(s^2+1)'},a=m[f]||'table';b2.innerText='Q: L{'+f+'}\nFormula ∫ e^-st f dt\nSteps => '+a;c2.innerText='FINAL: L{'+f+'}='+a;let xs=[],ys=[];for(let i=0;i<50;i++){xs.push(i*0.1);ys.push(E(f,i*0.1));}let e=d2;if(C.b)C.b.destroy();C.b=new Chart(e,{type:'line',data:{labels:xs,datasets:[{data:ys,borderColor:'red'}]}});}
function f3(){let s=a7.value,r=s.split(';').map(x=>x.split(',').map(Number)),a=r[0][0],b=r[0][1],c=r[1][0],d=r[1][1],det=a*d-b*c;b3.innerText='Q: ['+s+']\nSteps: Det='+a+'*'+d+'-'+b+'*'+c+'='+det;c3.innerText='FINAL: Det='+det;}
function f4(){let f=a8.value,df=a9.value,x=+a10.value,s='Q: root '+f+'=0\nFormula x_{n+1}=x-f/f\'\n';for(let i=0;i<6;i++){let fx=E(f,x),fdx=E(df,x),x1=x-fx/fdx;s+='Iter '+(i+1)+': '+x.toFixed(4)+' => '+x1.toFixed(4)+'\n';x=x1;}b4.innerText=s;c4.innerText='FINAL Root='+x.toFixed(6);let xs=[],ys=[];for(let i=0;i<100;i++){let t=-2+i*0.04;xs.push(t.toFixed(1));ys.push(E(f,t));}let e=d4;if(C.c)C.c.destroy();C.c=new Chart(e,{type:'line',data:{labels:xs,datasets:[{data:ys,borderColor:'green'}]}});}
function f5(){let f=a11.value,a=+a12.value,b=+a13.value,n=+a14.value,h=(b-a)/n,sum=E(f,a)+E(f,b);for(let i=1;i<n;i++){let x=a+i*h;sum+=(i%2==0?2:4)*E(f,x);}let I=sum*h/3;b5.innerText='Q: ∫'+f+' '+a+' to '+b+'\nFormula h/3 sum\nSteps h='+h.toFixed(4)+' I='+I.toFixed(6);c5.innerText='FINAL I='+I.toFixed(8);let xs=[],ys=[];for(let i=0;i<=50;i++){let x=a+(b-a)*i/50;xs.push(x.toFixed(2));ys.push(E(f,x));}let e=d5;if(C.d)C.d.destroy();C.d=new Chart(e,{type:'line',data:{labels:xs,datasets:[{data:ys,borderColor:'blue'}]}});}
function f6(){b6.innerText='Q: Fourier square L=2\nFormula bn=4/(nπ) odd';c6.innerText='FINAL Fourier 5 terms';let xs=[],ys=[];for(let i=0;i<100;i++){let x=-2+4*i/100,s=0;for(let k=1;k<=5;k+=2)s+=Math.sin(k*Math.PI*x/2)/k;ys.push(4/Math.PI*s);xs.push(x.toFixed(2));}let e=d6;if(C.e)C.e.destroy();C.e=new Chart(e,{type:'line',data:{labels:xs,datasets:[{data:ys}]}});}
function f7(){b7.innerText='Q: Taylor exp(x) at 0\nSteps: Σ x^n/n!';c7.innerText='FINAL: 1+x+x^2/2!+...';let xs=[],ys=[];for(let i=0;i<60;i++){xs.push((i*0.1).toFixed(1));ys.push(E(a15.value,i*0.1));}let e=d7;if(C.f)C.f.destroy();C.f=new Chart(e,{type:'line',data:{labels:xs,datasets:[{data:ys}]}});}
function f8(){let D=0*0-4*1*-1;b8.innerText='Q: A=1 B=0 C=-1\nFormula D=B²-4AC=0-4*1*-1=4';c8.innerText='FINAL: D=4 => Hyperbolic (Wave)';}
function f9(){b9.innerText='Q: z1=3+4i\nSteps: |z|=5 arg=53°';c9.innerText='FINAL |z|=5';}
function f10(){b10.innerText='Q: grad x^2*y at (1,2,3)\nSteps: ∇f=<2xy,x^2,0>';c10.innerText='FINAL ∇f=<4,1,0>';}
function f11(){b11.innerText='Q: Gamma5=4!=24';c11.innerText='FINAL Γ5=24 Beta=0.08333';}
function f12(){b12.innerText='Q: Z{a^n}=z/(z-a)\nSteps Pole a=0.5';c12.innerText='FINAL Z=z/(z-0.5)';}
</script></body></html>
