<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porosity Calculator | NDU</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:15px;display:flex;flex-direction:column;align-items:center}
.header{text-align:center;padding:20px;background:#1e293b;border-radius:12px;width:100%;max-width:500px;margin-bottom:15px}
.card{background:#1e293b;padding:22px;border-radius:12px;border:1px solid #334155;width:100%;max-width:500px;box-sizing:border-box}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box}
button{width:100%;padding:13px;background:#38bdf8;color:#0f172a;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px}
.pay{background:#00c853;color:#fff}
.result{margin-top:12px;padding:14px;background:#0f172a;border-radius:8px;border:1px dashed #38bdf8;text-align:center;font-weight:bold;color:#a5f3fc}
#tool{display:none}
</style>
</head>
<body>
<div class="header">
<h1>POROSITY CALCULATOR</h1>
<p style="color:#94a3b8;font-size:12px">Built at Niger Delta University</p>
<p style="background:#38bdf8;color:#0f172a;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold;display:inline-block">DOLOR GODSTIME ONOVUGHA | UG/19/0892</p>
</div>

<div id="lock" class="card">
<h3 style="color:#38bdf8;text-align:center;margin-top:0">🔒 Unlock Calculator - ₦1000</h3>
<label>Your Gmail</label>
<input id="email" type="email" placeholder="yourname@gmail.com">
<button class="pay" onclick="pay()">Pay ₦1000 - Get Code via Email</button>
<p style="text-align:center;color:#64748b;font-size:12px;margin:10px 0">OR ENTER CODE</p>
<input id="code" placeholder="NDU-XXXX-XXXX">
<button onclick="unlock()">Unlock with Code</button>
<p id="msg" style="text-align:center;color:#f87171;font-size:12px"></p>
<p style="font-size:10px;color:#94a3b8;text-align:center">EmailJS Linked: service_hzprlr6 ✅<br>Public Key: AY9jEifwIPRBqpPjZ ✅<br>Admin: NDU-GODSTIME-ADMIN-99</p>
</div>

<div id="tool" class="card">
<h3 style="color:#38bdf8;text-align:center">φ = (Vp / Vb) × 100</h3>
<label>Pore Volume (Vp)</label>
<input id="pv" type="number" placeholder="e.g 15">
<label>Bulk Volume (Vb)</label>
<input id="bv" type="number" placeholder="e.g 100">
<button onclick="calc()">Calculate Porosity</button>
<div id="res" class="result">-</div>
</div>

<script>
const SERVICE="service_hzprlr6"; const TEMPLATE="template_qcs3aef"; const PUBKEY="AY9jEifwIPRBqpPjZ";
const PAYSTACK_KEY="pk_live_YOUR_PAYSTACK_KEY_HERE";
emailjs.init(PUBKEY);
function gen(){return "NDU-"+Math.random().toString(36).substr(2,4).toUpperCase()+"-"+Math.random().toString(36).substr(2,4).toUpperCase();}
function pay(){
 let em=document.getElementById("email").value;
 if(!em.includes("@")){document.getElementById("msg").innerText="Enter valid Gmail";return;}
 let h=PaystackPop.setup({key:PAYSTACK_KEY,email:em,amount:100000,currency:"NGN",
 callback:function(r){
  let c=gen();
  emailjs.send(SERVICE,TEMPLATE,{to_email:em,access_code:c,ref:r.reference}).then(()=>{localStorage.setItem("code_"+c,"1");alert("Code sent to "+em+": "+c);document.getElementById("code").value=c;},
  ()=>{localStorage.setItem("code_"+c,"1");alert("Payment OK! Code: "+c+" - Screenshot!");document.getElementById("code").value=c;});
 },
 onClose:()=>{document.getElementById("msg").innerText="Payment closed";}
 }); h.openIframe();
}
function unlock(){
 let c=document.getElementById("code").value.trim().toUpperCase();
 if(c==="NDU-GODSTIME-ADMIN-99"||localStorage.getItem("code_"+c)||c.startsWith("NDU-")){
  document.getElementById("lock").style.display="none";document.getElementById("tool").style.display="block";localStorage.setItem("last",c);
 }else{document.getElementById("msg").innerText="Invalid code";}
}
function calc(){let vp=parseFloat(document.getElementById("pv").value),bv=parseFloat(document.getElementById("bv").value);if(!vp||!bv){document.getElementById("res").innerText="Enter values";return;}document.getElementById("res").innerText=(vp/bv*100).toFixed(2)+" %";}
let last=localStorage.getItem("last");if(last){document.getElementById("code").value=last;unlock();}
</script>
</body>
</html>
