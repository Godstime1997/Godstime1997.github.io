<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>Porosity Calculator</title>
  <style>
    body{font-family:Arial;max-width:500px;margin:auto;padding:20px;background:#f0f2f5}
    .box{background:#fff;padding:25px;border-radius:12px}
    h2{text-align:center;color:#0a4a70}
    label{font-weight:bold;display:block;margin-top:12px}
    input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
    button{width:100%;padding:12px;background:#0a4a70;color:#fff;border:0;border-radius:6px;margin-top:15px}
    .result{margin-top:15px;padding:15px;background:#e8f5e9;border-radius:6px;display:none;text-align:center;font-weight:bold}
  </style>
</head>
<body>
  <div class="box">
    <h2>Porosity Calculator</h2>
    <label>Pore Volume</label>
    <input id="pore" type="number" placeholder="e.g 15">
    <label>Bulk Volume</label>
    <input id="bulk" type="number" placeholder="e.g 100">
    <button onclick="c()">Calculate Porosity</button>
    <div id="r" class="result"></div>
  </div>
  <script>
    function c(){
      var p=parseFloat(document.getElementById('pore').value),
      b=parseFloat(document.getElementById('bulk').value),
      r=document.getElementById('r');
      if(isNaN(p)||isNaN(b)||b==0){
        r.style.display='block';
        r.innerHTML='Please enter valid numbers';return
      }
      r.style.display='block';
      r.innerHTML='Porosity = '+((p/b)*100).toFixed(2)+'%';
    }
  </script>
</body>
</html>
