<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petroleum Engineering Toolkit | NDU Final Year Project</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:15px}
.header{text-align:center;padding:30px;background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:15px;margin-bottom:20px}
.header h1{margin:0;color:#38bdf8;font-size:26px}
.badge{background:#38bdf8;color:#0f172a;padding:5px 10px;border-radius:20px;font-weight:bold;display:inline-block;margin-top:10px}
.card{background:#1e293b;padding:20px;border-radius:10px;border:1px solid #334155}
.result{margin-top:10px;padding:12px;background:#0f172a;border-radius:8px;border:1px dashed #334155;text-align:center;font-weight:bold;color:#a5f3fc}
</style>
</head>
<body>

<div id="paywall" style="text-align:center;padding:50px 20px;min-height:100vh;background:#0f172a;color:white;">
<h2 style="color:#38bdf8">NDU Porosity Calculator Pro v2</h2>
<p style="color:#94a3b8;">Pay ₦1,000 to get access code</p>

<div style="display:flex;justify-content:center;align-items:center;gap:0;max-width:400px;margin:20px auto;">
<input id="codeInput" placeholder="Enter code e.g NDU-123456" style="padding:15px;flex:1;border-radius:8px 0 0 8px;border:1px solid #334155;background:#1e293b;color:white;">
<button onclick="copyInputCode()" style="padding:15px 15px;border-radius:0 8px 8px 0;background:#334155;color:white;border:1px solid #334155;width:auto;">📋</button>
</div>

<button onclick="checkCode()" style="background:white;color:black;padding:14px 25px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin:5px;width:90%;max-width:400px;">Unlock</button>
<br>
<button onclick="payWithPaystack()" style="background:#38bdf8;color:black;padding:14px 30px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin:10px 5px;width:90%;max-width:400px;">Pay ₦1,000 with Paystack</button>

<p id="msg" style="margin-top:20px;"></p>
<p style="color:#475569;font-size:11px;margin-top:30px;">Secure payment by Paystack • Instant access code</p>
</div>

<div id="calculatorContent" style="display:none;">
<div class="header"><h1>PETROLEUM ENGINEERING TOOLKIT</h1><div class="badge">DOLOR GODSTIME ONOVUGHA | UG/19/0892</div></div>
<!-- Your calculators here - same as before -->
<div style="display:grid;grid-template-columns:1fr;gap:15px;max-width:700px;margin:20px auto">
<div class="card"><h3 style="color:#38bdf8;">1. Porosity</h3><input id="pv" placeholder="Pore Volume" type="number"><input id="bv" placeholder="Bulk Volume" type="number"><button onclick="calcPor()" style="width:100%;padding:12px;background:#38bdf8;border:none;border-radius:8px;font-weight:bold;margin-top:5px;">Calculate</button><div id="rPor" class="result">-</div></div>
<div class="card"><h3 style="color:#38bdf8;">2. STOIIP</h3><input id="area" placeholder="Area (acres)" type="number"><input id="h" placeholder="Thickness H (ft)" type="number"><input id="por" placeholder="Porosity fraction" type="number"><input id="sw" placeholder="Sw" type="number"><input id="fvf" placeholder="FVF" type="number"><button onclick="calcSTOIIP()" style="width:100%;padding:12px;background:#38bdf8;border:none;border-radius:8px;font-weight:bold;">Calculate</button><div id="rSTOIIP" class="result">-</div></div>
</div>
</div>

<script>
function calcPor(){let vp=parseFloat(document.getElementById("pv").value),bv=parseFloat(document.getElementById("bv").value);document.getElementById("rPor").innerText=(vp/bv*100).toFixed(2)+" %"}
function calcSTOIIP(){let Ar=parseFloat(document.getElementById("area").value),h=parseFloat(document.getElementById("h").value),por=parseFloat(document.getElementById("por").value),sw=parseFloat(document.getElementById("sw").value),fvf=parseFloat(document.getElementById("fvf").value);let sto=7758*Ar*h*por*(1-sw)/fvf;document.getElementById("rSTOIIP").innerText=sto.toFixed(2)+" STB"}
const PAYSTACK_KEY = "pk_live_522e90bc4d7ec45abe67ed9b807d7512a0d8ce5b";
const MASTER_CODE = "NDU-GODSTIME-ADMIN-99";
function checkCode(){
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  if(code === MASTER_CODE || code.startsWith("NDU-")){
    localStorage.setItem("ndu_paid","yes");
    document.getElementById("paywall").style.display="none";
    document.getElementById("calculatorContent").style.display="block";
  } else {
    document.getElementById("msg").innerHTML='<span style="color:#f87171;">Invalid Code! Pay ₦1,000</span>';
  }
}
function payWithPaystack(){
  var handler = PaystackPop.setup({
    key: PAYSTACK_KEY, email: "customer@ndu.edu.ng", amount: 100000, currency: "NGN",
    ref: "NDU-"+Math.floor(Math.random()*1000000000),
    callback: function(response){
      let code = response.reference;
      navigator.clipboard.writeText(code);
      document.getElementById("codeInput").value = code;
      document.getElementById("msg").innerHTML = `<div style="background:#1e293b;padding:15px;border-radius:10px;border:2px solid #38bdf8;"><p style="color:#22c55e;font-weight:bold;">✅ Payment Successful!</p><p style="color:white;font-size:20px;font-weight:bold;">${code}</p><button onclick="copyInputCode()" style="background:#38bdf8;color:black;padding:8px 20px;border:none;border-radius:6px;width:auto;">📋 Copy Code</button><br><br><button onclick="checkCode()" style="background:white;color:black;padding:10px 20px;border:none;border-radius:6px;width:auto;">Unlock Now →</button></div>`;
    },
    onClose: function(){ document.getElementById("msg").innerHTML='<span style="color:#f87171;">Payment cancelled</span>'; }
  });
  handler.openIframe();
}
function copyInputCode(){
  let v = document.getElementById("codeInput").value;
  if(!v){ alert("No code yet! Pay first"); return; }
  navigator.clipboard.writeText(v);
  alert("Copied: "+v);
}
window.onload = function(){ if(localStorage.getItem("ndu_paid")==="yes"){ document.getElementById("paywall").style.display="none"; document.getElementById("calculatorContent").style.display="block"; } }
</script>
</body>
</html>
